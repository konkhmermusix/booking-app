# Complete Windows Nginx Configuration for Laravel (booking-app) + XAMPP PHP-CGI

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # កើនទំហំកំណត់សម្រាប់បង្កាន់ដៃបង់ប្រាក់
    client_max_body_size 50M;

    server {
        listen       80;
        server_name  localhost 127.0.0.1;

        # ផ្លូវទៅកាន់ Folder public នៃ Project Laravel (ប្រើសញ្ញា / ជំនួស \)
        root   "D:/Final_Project_Sarana_P7_Y4_UHST_26/booking-app/public";
        index  index.php index.html index.htm;

        charset utf-8;

        # Dynamic Routing សម្រាប់ Laravel
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # តភ្ជាប់ Nginx ទៅកាន់ PHP FastCGI របស់ XAMPP
        location ~ \.php$ {
            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $realpath_root$fastcgi_script_name;
            include        fastcgi_params;
            fastcgi_read_timeout 300;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
